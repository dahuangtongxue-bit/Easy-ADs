<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><title>forms</title></head>
  <body>
    <!-- Static form definition so Netlify Forms can detect it; the React form posts here. -->
    <form name="early-access" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="early-access" />
      <input name="bot-field" />
      <input name="brand" />
      <input name="contact" />
      <input name="industry" />
      <textarea name="brief"></textarea>
    </form>
  </body>
</html>
